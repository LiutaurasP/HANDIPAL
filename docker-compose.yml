version: "3.9"

services:
  db:
    image: postgres:15
    container_name: handipal-db
    restart: always
    environment:
      POSTGRES_USER: handipal
      POSTGRES_PASSWORD: handipal
      POSTGRES_DB: handipal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  backend:
    build: ./backend
    container_name: handipal-backend
    restart: always

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://handipal:handipal@db:5432/handipal
      JWT_SECRET: "dev-secret-key"

    volumes:
      - ./backend:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: